apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: conn-officer-test-apis
  name: simple-web-api
  labels:
    app: simple-web-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-web-api
  template:
    metadata:
      namespace: conn-officer-test-apis
      name: simple-web-api
      labels:
        app: simple-web-api
    spec:
      containers:
        - name: simple-web-api
          image: #{CONTAINER_REGISTRY}#/simple-web-api:#{BUILD_ID}#
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: BUILD_ID
              value: "#{BUILD_ID}#"
            - name: BUILD_DATE
              value: "#{BUILD_DATE}#"
            - name: CODE_VERSION
              value: "#{CODE_BRANCH_NAME}#:#{CODE_COMMIT_SHA}#"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
